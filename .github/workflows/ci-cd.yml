# Конвеєр CI/CD СвітлоЛьвів Lite (ЛР № 4)
#
#   CI:  lint ─┐
#              ├─> e2e ─> CD: docker (артефакт → GHCR) ─> deploy-staging (+ smoke)
#        test ─┘
#
# Будь-яка помилка зупиняє конвеєр: наступні стадії отримують статус skipped.
name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: "CI · Статичний аналіз"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Встановити аналізатори
        run: pip install -r requirements-dev.txt
      - name: Ruff (лінтер, стандарт коду)
        run: ruff check . --output-format=github
      - name: Black (форматування)
        run: black --check --diff .
      - name: Bandit (безпека)
        run: bandit -q -r app bot
      - name: Xenon (поріг цикломатичної складності)
        run: xenon --max-absolute B --max-modules A --max-average A app bot

  test:
    name: "CI · Збірка, модульні та інтеграційні тести"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Збірка — встановлення залежностей
        run: pip install -r requirements-dev.txt -r requirements-bot.txt
      - name: Збірка — компіляція модулів
        run: python -m compileall -q app bot
      - name: Модульні та інтеграційні тести з покриттям
        run: >
          pytest tests/unit tests/integration
          --cov=app --cov=bot --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --cov-fail-under=90 --junitxml=reports/junit-unit-integration.xml
      - name: Підсумок покриття
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path("reports/coverage.xml")
          if p.exists():
              rate = float(ET.parse(p).getroot().get("line-rate")) * 100
              print(f"### Покриття коду: {rate:.1f} %")
          EOF
      - name: Зберегти звіти тестування
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  e2e:
    name: "CI · E2E-тести (Playwright)"
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Встановити Chromium
        run: playwright install --with-deps chromium
      - name: E2E-тести
        run: >
          pytest tests/e2e -v --junitxml=reports/junit-e2e.xml
          --tracing=retain-on-failure --output=test-results
      - name: Зберегти трасування невдалих тестів
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  docker:
    name: "CD · Артефакт: Docker-образ → GHCR"
    needs: [lint, test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Ім’я образу
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Зібрати та опублікувати образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.repo }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Підсумок
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          echo "### Образ опубліковано: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
