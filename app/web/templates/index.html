<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>СвітлоЛьвів Lite</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<main>
  <h1>СвітлоЛьвів Lite</h1>
  <p class="subtitle">Графік відключень і фактичний стан світла за вашою адресою</p>

  <section class="card">
    <form id="address-form" class="address" autocomplete="off">
      <input id="street" name="street" list="streets" placeholder="Вулиця, напр. Шевченка" required>
      <datalist id="streets"></datalist>
      <input id="house" name="house" placeholder="Будинок" required>
      <button id="find" type="submit">Показати</button>
    </form>
    <p id="error" class="error" role="alert"></p>
  </section>

  <div id="result" class="hidden">
    <section class="card">
      <p class="queue">Ваша черга: <strong id="queue">—</strong></p>
      <div id="status-indicator" class="indicator">—</div>
      <p id="next-change" class="meta"></p>
      <p id="next-outage" class="meta"></p>
      <p id="actual" class="actual"></p>
    </section>

    <section class="card">
      <h2>Що у вас зараз зі світлом?</h2>
      <div class="report">
        <input id="user-id" placeholder="Ваш user_id" aria-label="user_id">
        <button id="btn-on" class="on" type="button" data-status="on">Світло є</button>
        <button id="btn-off" class="off" type="button" data-status="off">Світла немає</button>
      </div>
      <p id="report-message" class="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Графік відключень на сьогодні</h2>
      <table>
        <thead><tr><th>Початок</th><th>Кінець</th></tr></thead>
        <tbody id="schedule"></tbody>
      </table>
    </section>
  </div>
</main>
</body>
</html>
