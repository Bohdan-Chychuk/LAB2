[project]
name = "svitlolviv-lite"
version = "1.2.0"
description = "СвітлоЛьвів Lite — графіки відключень світла у Львові"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: наскрізні тести Playwright",
    "smoke: перевірка розгорнутого середовища (потрібен BASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx`",
    # SVL-41: незакрите з’єднання з БД — помилка, а не попередження
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "bot"]
